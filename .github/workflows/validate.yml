name: Validate registry entries

on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'schema/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Checker regressions (offline)
        run: node --test --test-concurrency=1 scripts/security-checks.test.mjs

      - name: Schema + structural validation
        run: node scripts/validate.mjs

      - name: Resolve changed entries
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=AMR \
              "${{ github.event.pull_request.base.sha }}"...HEAD \
              -- 'integrations/*.json' | grep -v '/TEMPLATE\.json$' | tee changed.txt || true
          else
            ls integrations/*.json | grep -v '/TEMPLATE\.json$' | tee changed.txt || true
          fi
          echo "files=$(paste -sd' ' changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Security checks (per-entry)
        if: steps.changed.outputs.files != ''
        run: node scripts/security-checks.mjs ${{ steps.changed.outputs.files }}
